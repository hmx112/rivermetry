name: Inspect NWPS Gauge Report
on:
  push:
    branches: [bootstrap/rivermetry-release1]
    paths: ['.github/workflows/inspect-nwps.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Fetch NWPS all-gauges CSV header
        run: |
          python - <<'PY'
          import urllib.request
          url='https://water.noaa.gov/resources/downloads/reports/nwps_all_gauges_report.csv'
          req=urllib.request.Request(url, headers={'User-Agent':'Rivermetry/0.1'})
          with urllib.request.urlopen(req, timeout=60) as r:
              chunk=r.read(32768).decode('utf-8-sig', errors='replace')
          lines=chunk.splitlines()[:5]
          open('nwps-report-sample.txt','w').write('\n'.join(lines))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nwps-report-sample
          path: nwps-report-sample.txt
