name: Inspect NWPS Gauge Schema
on:
  push:
    branches: [bootstrap/rivermetry-release1]
    paths: ['.github/workflows/inspect-nwps.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Fetch NWPS gauge sample
        run: |
          python - <<'PY'
          import json, urllib.request
          req=urllib.request.Request('https://api.water.noaa.gov/nwps/v1/gauges', headers={'User-Agent':'Rivermetry/0.1'})
          with urllib.request.urlopen(req, timeout=60) as r:
              payload=json.load(r)
          if isinstance(payload, dict):
              out={'top_level_keys':list(payload.keys()), 'sample': {}}
              for key,value in payload.items():
                  if isinstance(value,list) and value:
                      out['sample'][key]=value[:3]
                  elif not isinstance(value,(list,dict)):
                      out['sample'][key]=value
          else:
              out={'top_level_type':type(payload).__name__, 'sample':payload[:3] if isinstance(payload,list) else payload}
          open('nwps-schema-sample.json','w').write(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nwps-schema-sample
          path: nwps-schema-sample.json
