name: Inspect NWPS Gauge Report
on:
  push:
    branches: [bootstrap/rivermetry-release1]
    paths: ['.github/workflows/inspect-nwps.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Summarize NWPS all-gauges CSV
        run: |
          python - <<'PY'
          import csv, io, json, urllib.request
          from collections import Counter
          url='https://water.noaa.gov/resources/downloads/reports/nwps_all_gauges_report.csv'
          req=urllib.request.Request(url, headers={'User-Agent':'Rivermetry/0.1'})
          with urllib.request.urlopen(req, timeout=60) as r:
              text=r.read().decode('utf-8-sig', errors='replace')
          rows=list(csv.DictReader(io.StringIO(text)))
          statuses=Counter((row.get('forecast status') or '').strip() for row in rows)
          summary={
              'rows':len(rows),
              'with_usgs_id':sum(bool((r.get('usgs id') or '').strip()) for r in rows),
              'forecast_status_blank':statuses.get('',0),
              'forecast_status_contains_not_available':sum(c for s,c in statuses.items() if 'not available' in s.lower()),
              'top_forecast_statuses':statuses.most_common(20),
              'samples_with_usgs_id':[{
                  'lid':r.get('nws shef id'),
                  'usgs_id':r.get('usgs id'),
                  'state':r.get('state'),
                  'forecast_status':r.get('forecast status'),
                  'pedts':r.get('pedts'),
              } for r in rows if (r.get('usgs id') or '').strip()][:20],
          }
          open('nwps-report-summary.json','w').write(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nwps-report-summary
          path: nwps-report-summary.json
