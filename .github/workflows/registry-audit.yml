name: Registry Audit
on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - run: rivermetry audit-registry --input data/locations.json --output audit.json
      - uses: actions/upload-artifact@v4
        with: {name: registry-audit, path: audit.json}
