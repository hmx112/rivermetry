name: Inspect HADS Cross Reference
on:
  push:
    branches: [bootstrap/rivermetry-release1]
    paths: ['.github/workflows/inspect-hads.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Find HADS JSON links
        run: |
          python - <<'PY'
          import json, re, urllib.request, urllib.parse
          base='https://hads.ncep.noaa.gov/USGS/'
          req=urllib.request.Request(base, headers={'User-Agent':'Rivermetry/0.1'})
          html=urllib.request.urlopen(req, timeout=30).read().decode('utf-8','replace')
          hrefs=re.findall(r'href=["\']([^"\']+)["\']',html,re.I)
          links=[urllib.parse.urljoin(base,h) for h in hrefs if 'json' in h.lower()]
          open('hads-json-links.json','w').write(json.dumps(links,indent=2))
          print('\n'.join(links[:20]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hads-json-links
          path: hads-json-links.json
