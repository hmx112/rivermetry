name: Metadata Weekly Audit
on:
  schedule:
    - cron: '23 7 * * 0'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - run: rivermetry discover-usgs --output metadata-candidates.json --limit 450
      - uses: actions/upload-artifact@v4
        with: {name: metadata-weekly, path: metadata-candidates.json}
