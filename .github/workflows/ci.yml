name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -v
      - run: python -m ruff check .
      - run: BASE_URL=https://rivermetry.example WORKER_BASE_URL=https://current.rivermetry.example rivermetry build --fixtures --output dist
      - run: python -m rivermetry.build.guard dist
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm test
        working-directory: worker/current-observation
