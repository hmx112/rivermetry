name: Refresh Static
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - run: rivermetry release-gate
      - run: python -m pytest -v && python -m ruff check .
      - name: Build static output
        env:
          SITE_NAME: ${{ vars.SITE_NAME }}
          BASE_URL: ${{ vars.BASE_URL }}
          WORKER_BASE_URL: ${{ vars.WORKER_BASE_URL }}
        run: rivermetry refresh-static --output dist
      - run: rivermetry export-worker-allowlist
      - name: Deploy Pages
        if: ${{ vars.BASE_URL != '' && vars.CLOUDFLARE_PAGES_PROJECT != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
